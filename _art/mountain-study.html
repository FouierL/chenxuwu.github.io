<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Mountain study · background artwork</title>
<style>
  body { background: #fcfbf8; color: #292723; }
  canvas { display: block; max-width: 100%; height: auto !important; }
  a { color: #873f32; margin-right: 1em; }
</style>
<!-- Open this file to repaint the two margins and download the WebP assets. -->
<script src="https://cdn.jsdelivr.net/gh/acamposuribe/p5.brush@7a65597703df2863d8442208791e093ddeab3a35/dist/brush.js"></script>
<body>
<script>
const width = 1024, height = 416, density = 2;
const sheet = brush.createCanvas(width, height, { pixelDensity: density });
brush.seed(2389);
brush.noiseSeed(318);
brush.clear('#ffffff');
brush.translate(-width / 2, -height / 2);

let seed = 4827;
function random() {
  seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
  return seed / 4294967296;
}

function wash(points, color, opacity) {
  brush.noStroke();
  brush.fill(color, opacity);
  brush.fillBleed(0.12, 'out');
  brush.fillTexture(0.62, 0.34);
  brush.polygon(points);
}

function pencil(points, color, weight) {
  brush.noFill();
  brush.set('2B', color, weight);
  brush.spline(points, 0.28);
}

// Broken contours follow the outcrops, leaving slips of paper between washes.
function weathered(points) {
  const line = [points[0]];
  for (let i = 1; i < points.length; i++) {
    const [x, y] = points[i - 1];
    const dx = points[i][0] - x, dy = points[i][1] - y;
    const steps = Math.ceil(Math.hypot(dx, dy) / 7);
    for (let j = 1; j < steps; j++) {
      line.push([x + dx * j / steps + (random() - 0.5) * 3,
                 y + dy * j / steps + (random() - 0.5) * 5]);
    }
    line.push(points[i]);
  }
  return line;
}

function ridge(crest, foot, color, opacity) {
  wash([...weathered(crest), ...foot], color, opacity);
}

// Far peaks disappear into the unpainted mist.
ridge([[-8,168],[22,150],[46,98],[60,80],[73,96],[85,82],[96,44],
       [107,34],[114,51],[122,57],[137,110],[151,120],[166,96],[176,105],
       [188,137],[199,134],[217,164],[232,152],[252,169],[287,198],[320,211]],
      [[252,205],[181,196],[110,182],[40,187],[-8,199]], '#71989a', 195);
ridge([[-8,190],[15,178],[39,143],[52,133],[64,152],[86,125],[103,144],
       [121,134],[139,167],[152,161],[166,178],[205,192],[223,210],[258,221]],
      [[180,213],[115,209],[57,216],[-8,235]], '#527976', 203);

// Two near granite faces and their broken, warm-grey shadows.
ridge([[-8,191],[13,159],[26,150],[40,111],[55,95],[68,60],[77,54],
       [88,66],[94,91],[107,111],[116,145],[131,153],[140,174],[154,162],
       [166,179],[182,225],[211,239],[235,259]],
      [[209,267],[139,257],[73,283],[-10,292]], '#53756c', 232);
ridge([[71,64],[76,55],[87,68],[94,94],[108,114],[118,149],[131,155],
       [140,177],[153,166],[166,182],[181,225],[200,240]],
      [[142,225],[119,210],[99,195],[86,141],[88,119],[77,108]], '#3c5451', 214);
ridge([[-8,286],[23,267],[43,249],[61,244],[78,217],[91,201],[105,211],
       [114,204],[126,190],[135,194],[148,221],[164,224],[178,248],
       [202,262],[219,285],[246,289],[268,304],[290,315]],
      [[233,310],[151,302],[76,307],[-8,326]], '#667f71', 221);

for (const [x, y, reach] of [[76,62,106],[90,100,83],[109,133,64],[49,123,93],
                              [131,193,57],[93,210,54],[158,172,44]]) {
  for (let i = 0; i < 9; i++) {
    const startX = x + (random() - 0.5) * 12, startY = y + random() * 27;
    const length = reach * (0.28 + random() * 0.7);
    pencil([[startX,startY],[startX+2,startY+length*.27],
            [startX+9,startY+length*.59],[startX+13,startY+length]],
           i % 3 ? '#61716a' : '#aa906f', 0.65 + random() * 0.75);
  }
}

// Low wooded headland and the pointed foreground bank.
ridge([[-10,326],[14,315],[36,307],[51,290],[69,285],[88,291],[102,282],
       [121,286],[144,299],[171,306],[197,325],[216,329],[244,346],
       [275,351],[299,363],[336,369],[362,380]],
      [[300,380],[241,375],[195,381],[137,372],[66,384],[-10,397]], '#465e53', 241);
ridge([[-10,361],[28,342],[53,330],[80,332],[110,340],[129,342],[158,358],
       [197,366],[224,380],[277,387],[297,393]],
      [[230,390],[167,397],[114,392],[37,409],[-10,408]], '#8f7d62', 216);

// Wind-shaped pines. Each branch ends in a fan of short dry needles.
function pine(x, y, h, lean) {
  const trunk = t => [x + h * (lean*t + .045*Math.sin(t*8)), y - h*t];
  pencil([trunk(0),trunk(.26),trunk(.48),trunk(.72),trunk(1)], '#3e4437', h/28);
  for (let i = 0; i < 9; i++) {
    const t = .31 + i*.081, [bx,by] = trunk(t);
    const span = h*(1.15-t)*(.24+random()*.26)*(i%3 === 0 ? -1 : 1);
    const ex = bx + span, ey = by - h*(.06+random()*.06);
    pencil([[bx,by],[bx+span*.4,by+1],[ex,ey]], '#454f40', h/43);
    const radius = h*(.034+random()*.043);
    pencil([[ex-radius*1.6,ey],[ex-radius*.35,ey-radius*.44],
            [ex+radius*.35,ey-radius*.6],[ex+radius*1.5,ey-radius*.2]],
           '#4c6251', .6+h/40);
    for (let j = 0; j < 13; j++) {
      const a = -Math.PI * random();
      const r = radius*(.4+random()*.7);
      pencil([[ex+(random()-.5)*radius,ey],[ex+Math.cos(a)*r*1.9,ey+Math.sin(a)*r]],
             '#3c5847', .55 + h/105);
    }
  }
}
for (const tree of [[9,319,34,.11],[33,308,52,-.08],[49,299,41,.08],
                    [62,289,24,-.14],[80,292,64,.17],[96,293,34,-.06],
                    [129,294,21,.16],[153,304,18,-.09]]) pine(...tree);

// Across the open water, the sun and a much lower, quieter shore.
brush.noStroke();
brush.fill('#c6744e', 217);
brush.fillBleed(.08, 'in');
brush.fillTexture(.73, .38);
brush.circle(932, 197, 19, .08);
ridge([[682,317],[711,311],[736,301],[749,301],[764,293],[783,288],
       [802,273],[816,268],[830,274],[846,258],[862,248],[874,251],
       [888,227],[898,218],[910,228],[923,221],[939,244],[953,248],
       [967,238],[982,246],[1000,222],[1012,209],[1034,221]],
      [[1034,298],[952,284],[867,293],[795,299],[729,316]], '#789093', 198);
ridge([[764,342],[805,334],[836,324],[863,323],[886,311],[910,302],
       [932,306],[953,290],[975,281],[994,283],[1010,271],[1034,263]],
      [[1034,318],[973,320],[908,327],[828,336]], '#647c77', 218);
ridge([[832,371],[862,363],[894,357],[914,347],[934,344],[956,329],
       [972,327],[985,315],[996,308],[1012,307],[1034,292]],
      [[1034,372],[989,369],[941,363],[871,374]], '#4e6a5d', 229);
for (const tree of [[946,339,13,.09],[958,332,20,-.10],[971,331,15,.08],
                    [996,312,24,.09],[1010,310,17,-.11]]) pine(...tree);

// A narrow fishing skiff gives the long, empty stretch of water a scale.
wash([[785,364],[795,367],[813,367],[826,362],[819,368],[797,370]], '#654b38', 239);
pencil([[785,364],[796,368],[814,368],[826,362]], '#493d33', 1.4);
pencil([[799,366],[802,362],[808,362],[811,366]], '#725d46', 1.7);
pencil([[815,365],[817,360],[819,364]], '#48493d', 1.7);
pencil([[817,361],[824,370],[829,374]], '#564c40', .9);

for (const [x,y,span] of [[0,400,98],[139,398,94],[214,399,79],[290,383,69],
                          [336,383,47],[275,392,32],[704,325,46],[760,348,76],
                          [815,353,46],[786,381,84],[863,384,58],[919,380,73]]) {
  pencil([[x,y],[x+span*.29,y-1],[x+span*.62,y+.3],[x+span,y]], '#687f79', .85);
}
brush.render();

// Lift the white paper out of both crops so the washes take on the site's paper color.
for (const [i, name] of ['mountain-pines', 'mountain-shore'].entries()) {
  const crop = document.createElement('canvas');
  crop.width = width*density/2;
  crop.height = height*density;
  const ctx = crop.getContext('2d');
  ctx.drawImage(sheet, -i*crop.width, 0);
  const pixels = ctx.getImageData(0, 0, crop.width, crop.height);
  const data = pixels.data;
  for (let k = 0; k < data.length; k += 4) {
    const alpha = 255 - Math.min(data[k], data[k+1], data[k+2]);
    if (alpha > 0) {
      for (let c = 0; c < 3; c++) data[k+c] = 255 - (255-data[k+c])*255/alpha;
    }
    data[k+3] = Math.round(alpha / 3) * 3;
  }
  ctx.putImageData(pixels, 0, 0);
  const link = document.createElement('a');
  link.download = name + '.webp';
  link.textContent = link.download;
  link.href = crop.toDataURL('image/webp', 0.88);
  document.body.append(link);
}
</script>
</body>
</html>
