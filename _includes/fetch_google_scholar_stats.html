<script>
    $(document).ready(function () {
        var total = document.getElementById('total_cit');
        var paperCounts = document.querySelectorAll('.show_paper_citations');
        if (!total && !paperCounts.length) return;

        var snapshot = {{ site.data.google_scholar | jsonify }};
        var path = 'google-scholar-stats/gs_data.json';
        var rawUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/' + path;
        {% if site.google_scholar_stats_use_cdn %}
        var primaryUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@' + path;
        {% else %}
        var primaryUrl = rawUrl;
        {% endif %}

        function renderCitations(data) {
            if (!data || data.scholar_id !== snapshot.scholar_id || typeof data.updated !== 'string' ||
                !Number.isSafeInteger(data.citedby) || data.citedby < 0) return false;
            var updated = Date.parse(data.updated);
            if (!Number.isFinite(updated) || updated < Date.parse(snapshot.updated)) return false;

            if (total) {
                total.textContent = data.citedby;
                total.title = 'Google Scholar · ' + data.updated.slice(0, 10);
            }
            var publications = data.publications || {};
            paperCounts.forEach(function (element) {
                var paper = publications[element.getAttribute('data')];
                if (paper && Number.isSafeInteger(paper.num_citations) && paper.num_citations >= 0) {
                    element.textContent = '| Citations: ' + paper.num_citations;
                }
            });
            return true;
        }

        function load(url, fallback) {
            function tryFallback() {
                if (fallback) load(rawUrl, false);
            }
            $.ajax({url: url, dataType: 'json', timeout: 10000})
                .done(function (data) {
                    if (!renderCitations(data)) tryFallback();
                })
                .fail(tryFallback);
        }
        load(primaryUrl, primaryUrl !== rawUrl);
    });
</script>
